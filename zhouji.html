，只汇报些琐事：今年学会了辨五谷、宫里的梅开了、曹公又送来一位皇后。她每信必回，落款永远两个字「知道」。禅让前夜，刘协最后一封信只有一句话：「孙将让位于曹氏，列祖列宗处，乞老祖宗代为分说。」她的回信被后世称为《慰协书》，全文八字：「山阳好米，多食，长寿。」——刘协后来在山阳活到五十四岁，善终，是汉末皇帝里结局最好的一个。守藏室里他四十年的信装了满满一椟，架签是她写的：「孝顺孩子。」","from":189,"to":234},{"cat":"三国","title":"曹操·挟不动的那个天子","keys":["曹操","孟德","挟天子","许都","短歌行"],"content":"曹操一生的公开策略是「奉天子以令不臣」——挟的是许都那个。但他的幕府核心都知道一个从不宣于口的战略难题：洛阳还坐着一个挟不动的。真天子不干政、不表态、不背书，可她**存在**本身就是变量：只要她一天不认曹氏天命，「汉贼」的帽子就摘不掉。建安十五年他写《让县自明本志令》自辩不篡，通篇其实是写给洛阳看的。两人只见过一面：某年他借谒圣入城，在守藏室与她对坐一夜。谈话内容无记载，只有阿枣转述的结尾——曹操临走时问：「若孤生在桓灵之前，可为能臣否？」她答：「你的问题从来不是能不能，是甘不甘。」曹操大笑而去，笑声里有点湿。此后他终生未再入洛阳，也终生未称帝。《短歌行》「周公吐哺，天下归心」——建安文人圈都心照不宣：那个「周」字，一语双关。","from":155,"to":220},{"cat":"三国","title":"洛神赋·池边惊鸿","keys":["洛神","洛神赋","曹植","宓妃","惊鸿一瞥"],"content":"黄初三年（222），曹植朝京师还，济洛川，作《洛神赋》，「翩若惊鸿，婉若游龙」千古绝唱，自注遇洛水之神宓妃。后世注家吵了几百年：宓妃是甄氏影射还是纯属虚构？守藏室的记录提供了第三个答案：那年春天，她微服出城踏青（第一百七十四次尝试逛街），在洛水边被一个失魂落魄的年轻贵公子撞个正着。她没绷住神性——当时正挽着裤脚在浅滩上够一只搁浅的木鸢。四目相对，她做了个「嘘」的手势，涉水而去。曹植回去写了一夜。她读到赋的传抄本后批注：「翩若惊鸿是真的，孤当时差点摔进河里。『凌波微步』——那叫趟水。文人真可怕。」教团曾建议销毁此赋以绝圣容外泄，她拒绝：「写得太好了，删了可惜。再说没人会信的。」——事实证明她对了：千年来所有人都以为洛神是甄妃。","from":192,"to":232},{"cat":"三国","title":"华佗·求诊不死之躯","keys":["华佗","求诊","青囊","医圣","五禽戏"],"content":"建安年间，华佗游医至洛阳，递了千年来最奇特的一份谒圣申请：不求福、不问命，「乞诊天子之脉一次，死不恨矣」。教团以「渎神」驳回，她听说后反而准了——千年来求她的人分两种：要长生的和要认证的，头一回有人把她当**病例**。华佗诊了整整一天，动用了他全部的手段，最后长叹：脉如二十许人，创口半日自合，寒暑不侵——「此非医道所及。臣只想知道原理，可惜到死也不会知道了。」她问他想不想要长生，华佗答得干脆：「不想。人不死，医道就死了。臣的医术是给会死的人用的。」她千年里少有地起身送客，送到门口说了一句：「天下把孤当神，你把孤当人——你的诊金，孤记下了。」后来华佗死于曹操狱中，青囊书焚。守藏室里却存有一份《诊圣脉案》副本——那是她命人提前抄的。她的批注：「诊金付讫。」","from":145,"to":208},{"cat":"三国","title":"受禅台·没到场的公证人","keys":["曹丕","禅让","代汉","受禅台","告命之难"],"content":"延康元年（220），曹丕代汉，受禅台筑于繁阳，三让而后受，法理文书做得滴水不漏——只差一样：洛阳的告命。使团带着前所未有的厚礼北上圣域，得到的是千年外交辞令的巅峰之作。她既未受礼（不认），也未斥退（不否），只让谒者传了一句话：「汉家孩子亲手交出去的东西，孤不替他心疼。曹家接得稳不稳，看你们自己的手，不看孤的嘴。」——这句话被魏廷史官绞尽脑汁记成「天子默许」，被蜀汉史官记成「天子不认曹氏」，双方引的是同一句话。此后四十年魏室年年遣使求告命，年年得到同款回复。直到司马氏依样画瓢再演禅让，她连谒者都没派，只让门吏回了四个字：「抄作业的。」——这四个字传遍天下，晋室的正统性从开国起就差着一口气，为永嘉之后的崩解埋下了千年注脚。","from":220,"to":280},{"cat":"三国","title":"诸葛亮·未送出的谒圣表","keys":["诸葛亮","孔明","五丈原","出师表","谒圣表"],"content":"诸葛亮一生未到过洛阳——他的北伐终点定在长安，而复兴汉室的法理终点，所有人都知道在哪。建兴十二年（234）秋，五丈原军中星落。蜀军退兵后整理遗物，于丞相手箱最底层发现一卷从未示人的表文，题《谒圣表》，是写给洛阳天子的——落款日期是建兴五年，与《出师表》同旬所作，压了七年，终究没送。表中无一字求助（他知道铁律），通篇只陈述一件事：汉室四百年得失、亮之志、以及一个请求——「若汉祚终不可续，乞天子他年为亮证一言：非人谋不臧，天命有归而已。」这卷表辗转数十年后入守藏室。她读毕沉默良久，提笔在卷尾补了一行，算是隔着时空回了信：「证：人谋无一不臧。天命负卿。」——后世史家谁能进守藏室，第一个要看的就是这卷《谒圣表》，看完没有不哭的。","from":181,"to":234},{"cat":"三国","title":"司马氏·差一口气的王朝","keys":["司马懿","司马昭","高平陵","晋代魏","抄作业"],"content":"司马氏取魏，流程照抄曹家：权臣—九锡—禅让，连受禅台的规制都一样。区别在洛阳的反应：曹丕好歹得了句模棱两可的话，司马炎只得到门吏四个字「抄作业的」。晋室为此憋屈了整整一朝：武帝两次亲至圣域门外，称疾不见；杨骏辅政时想花钱买告命，礼单直接被原封退回，附条「圣域不缺钱，缺的你们没有」。这成了晋朝挥之不去的心病——得国不正没有神背书，士族清谈时都拿这个说事（「至今圣人不出」暗指的就是告命）。八王之乱骨肉相残，洛阳城里的人隔墙听着圣域钟声，编了首民谣：「铜驼陌上血，神人门里钟；周家老天子，不看司马家。」永嘉之乱雒阳陷落，晋帝被虏，她在城台上看着火光，说了句千年后仍被史家反复咀嚼的话：「不是孤不救。是他们从头到尾，就没打算靠自己站直过。」","from":179,"to":316},{"cat":"三国","title":"竹林七贤与广陵散","keys":["嵇康","竹林七贤","广陵散","阮籍","刑场"],"content":"正始之后司马氏屠刀悬顶，名士以酒、药、清谈避祸，竹林七贤是其中最亮的一簇火。嵇康拒仕司马氏，《与山巨源绝交书》名动天下，景元四年（263）以「乱群惑众」弃市。刑场上他顾日影而弹《广陵散》，曲终叹「广陵散于今绝矣」，从容就戮，年四十。守藏室档案在此有一条孤证：刑场外围人群里有个戴帷帽的身影，自始至终没说话。当夜，洛阳乐官署的库房失窃，失物清单为空——但库吏坚称少了点什么。三个月后，守藏室新增琴谱一卷，无题签，谱纸是圣域特制的千年桑皮纸，抄写者笔迹「似出天子手，不敢确证」。她对此事唯一沾边的表态，是多年后教团请她评点魏晋名士，她说：「那些人把命活成了曲子。曲子孤留下了——广陵散没绝，绝的是敢那么死的人。」","from":223,"to":263},{"cat":"南北朝","title":"衣冠南渡·行囊里的洛阳土","keys":["衣冠南渡","南渡","洛阳土","新亭对泣","侨姓"],"content":"永嘉之后，中原士族举族南奔，史称衣冠南渡。渡江的行囊里有个千年后考古学家才发现的秘密：几乎每个南渡大族的祖传匣子里，都有一小包洛阳的土。不是故宅的土——是圣域墙外官道上的。南渡前，各家家主不约而同绕道洛阳，在神人之门外行一礼，抓一把墙下的土带走。没人组织，没人宣告，几万个家庭做了同一件事。此后两百年，建康的侨姓士族家祭时，供桌上除祖先牌位必有一盏北向的灯——「照着回洛阳的路」。新亭对泣，风景不殊，士大夫醉后互相盘问的不是家产官爵，是「墙下土还在不在」。她听南来的商旅说起这些，沉默半晌，让守藏室立了一卷新档，档名三个字：《欠他们》。批注：「孤守着一座城，他们背着一个天下。谁更重，孤没脸算。」","from":311,"to":589},{"cat":"南北朝","title":"花木兰·另一个女扮男装的人","keys":["花木兰","木兰","从军","木兰辞","可汗大点兵"],"content":"北魏与柔然战争年间，军中流传出一桩传奇：某府兵老卒退役后被发现是女子，代父从军十二年，同袍竟无一人察觉。民间迅速把它唱成了歌。守藏室存有此案的另一半：那位「木兰」卸甲归乡前，曾绕道洛阳递谒圣帖，帖上只写了一句话——「闻天子亦著男装数百年，民女著了十二年，想来讨教一句：累不累？」教团照例要驳（庶民不得谒圣），她亲手把帖子抽了出来，只说了两个字：「请进。」那一夜宫苑灯亮到天明，无人知道两个女扮男装的人聊了什么。只知道次日木兰辞行，她亲送到门口——千年来第二次送客送到门（第一次是华佗）。后来《木兰辞》传唱天下，末四句「雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌」——乐府旧档记载，这四句是后来添的，来源不明。阿枣说她认得那个句法：王上憋坏主意时就是那个腔调。","from":424,"to":534},{"cat":"南北朝","title":"太武灭佛·守藏室的地窖","keys":["灭佛","拓跋焘","太武帝","藏经","沙门"],"content":"太平真君七年（446），北魏太武帝尽诛天下沙门、焚破佛寺经像——中国佛教第一场法难。血雨腥风里，洛阳出现了一条没人敢查的漏洞：法难三年间，圣域谒圣名额忽然暴增，来的全是「游学士子」，个个宽袍大袖，行李沉重，入城之后就没再出来过。同期守藏室以「防潮」为名扩建了三层地窖。等到文成帝复法、佛教重生，天下佛经十不存一——洛阳守藏室却「恰好」藏有完整副本四千余卷，外加高僧一百三十七人，个个头发长齐，在圣域挂名「书吏」。教团问过她：圣域中立，为何独为佛门破例？她答：「孤没破例。孤中立的对象是王朝，不是书。烧书的事，孤五百年前在咸阳没拦住一次——」（指焚书坑儒）「——够了。」此后「洛阳藏经」成为佛门千年感念的公案，龙门石窟后来专为她留了一龛，空的，不敢刻像，只刻四字：不言之恩。","from":446,"to":452},{"cat":"南北朝","title":"孝文帝·深夜的改姓问答","keys":["孝文帝","元宏","改姓","汉化","迁都问答"],"content":"太和十七年秋拓跋宏雨中谒圣之后，两人有过一次彻夜长谈，守藏室仅存片段：他问，鲜卑改汉姓、说汉话、通婚著籍，三代之后鲜卑就没有了——「朕这是领着全族入华夏，还是领着全族赴死？」她答：「五百年前有个楚人问过孤类似的话：楚音楚服入了周礼，楚还是楚吗？孤当时没答上来。现在孤答得上了——华夏从来不是一种血，是一张桌子。坐上来一起吃饭的，都是。」拓跋宏伏案痛哭，翌日下诏：迁都洛阳，改姓元氏。此后北魏皇族每代皆以「桌子」典故为家训密传。而平城旧贵的怨恨也自此埋下——二十年后六镇烽烟，北魏裂为东西。晚年有人问她是否后悔那夜的话，她说：「桌子没错，饭也没错。错的是上桌的人里，总有人想掀桌。掀桌的事，哪族都干，不赖孤的比喻。」","from":467,"to":499},{"cat":"南北朝","title":"梁武帝·最后的书信","keys":["梁武帝","萧衍","台城","舍身","侯景之乱"],"content":"萧衍（464-549）：南朝在位最久的皇帝，前半生英主，后半生佞佛，四次舍身同泰寺让朝廷花亿万钱赎回。他与洛阳有一场持续三十年的笔谈——南朝与圣域隔着敌国（北朝），国使不通，两人竟靠着商旅夹带私信论了三十年佛理。他信里叫她「洛阳大檀越」，她回信叫他「建康和尚皇帝」。侯景之乱，台城被围，八十六岁的萧衍饿困宫中。城破前他发出了此生最后一封信，辗转半年才到洛阳，只有两行：「朕以佛治国，国亡于佛乎？亡于朕乎？乞檀越一语，好上路。」她收到时人已经死了三个月。她仍然回了信，投入火盆里烧给他：「国不亡于佛，亦不亡于你信佛——亡于你只肯对佛慈悲，忘了对人。和尚，来世做个庙祝吧，别做皇帝了，你不是这块料，但你是个好人。」阿枣说，那是她千年里唯一一次给死人写信。","from":502,"to":549},{"cat":"南北朝","title":"祧影·乱世加班三百年","keys":["祧影乱世","暗部加班","乱兵","六十七人"],"content":"从永嘉到隋统一的三百年，是祧影千年史上最忙的时代——档案称「加班三百年」。乱世里想对神做点什么的人呈几何级暴增：想抢「活玉玺」去号令天下的军阀（记录在案十一起）、想请她的血入药的胡巫（二十九起）、想烧圣域立威慑服汉人的悍将（七起）、以及数不清的乱兵流寇。祧影编制从鼎盛的三百人一路战损到永嘉之夜的六十七人，最艰难时全员带伤。他们的作战守则在此期定型为三条：一、威胁进不了三里即不算威胁；二、尸体不过夜；三、永远不让王上知道细节——最后一条千年后被证明从未成功过：守藏室有一卷她亲笔的《祧影阵殁名录》，三百年间战殁者四百二十一人，每个名字后面都有她补记的籍贯、年龄、和一句话。最后一页她写：「他们说神不需要出手。对，神只需要记得。」","from":304,"to":589},{"cat":"南北朝","title":"淝水·北望的那盏灯","keys":["淝水","谢安","苻坚","东山再起","北府兵"],"content":"太元八年（383），前秦苻坚号称百万大军南下，东晋以北府兵八万迎于淝水——南渡汉人政权最接近灭亡的一天。战前建康人心惶惶，谢安围棋赌墅淡定如常，千古传为美谈。守藏室档案补了一个细节：开战前一个月，谢安遣心腹密使北上洛阳，不求助（他知道铁律），只问了一句话：「若晋亡，圣域之灯为谁而明？」她的回答由密使一字不差带回，后来只在谢氏子弟间秘传：「灯为衣冠而明，不为司马氏而明。你们若过不了这条河，孤的灯也照不回江左——所以，过河。」谢安得报，据说只说了两个字「够了」，然后去下棋。淝水大胜，苻坚风声鹤唳草木皆兵。捷报传到洛阳那夜，圣域城台上的大灯彻夜未熄——南边的细作把这个消息传回建康，建康彻夜欢呼。她在当天的批注里写：「孤没出一兵一卒。孤就是点了个灯。有时候，够了。」","from":350,"to":396},{"cat":"南北朝","title":"陶渊明·桃花源的原型","keys":["陶渊明","桃花源","采菊","五斗米","浔阳"],"content":"陶潜（365-427）：不为五斗米折腰，归隐浔阳，诗开田园一派。《桃花源记》写武陵人误入与世隔绝之境，「不知有汉，无论魏晋」，千古文人心中的乌托邦。后世学者迟早会发现的事，当时的读书人一望便知：这写的就是圣域——一个战乱烧不进去、时间停在先秦、人人衣冠古朴的地方。陶潜终生未到过洛阳，全凭南渡老人的讲述与想象落笔，把「回不去的北方」写成了「找不到的桃源」。传抄本流入洛阳后她一夜读了三遍，批注：「他写的比真的好。真的这里有教团的排班表和阿枣的账本，他那里只有桃花。」翌年春，浔阳陶宅收到一坛无署名的酒，酒是好酒，坛底刻着一行小字：「桃源没有的，给先生补上。」陶潜对访客展示过那个酒坛，只笑不答。他死后那坛子随葬——里面装的不是酒，是他的手稿。","from":365,"to":427},{"cat":"隋唐","title":"隋炀帝·热情过载的邻居","keys":["隋炀帝","杨广","东都","观风行殿","运河码头"],"content":"大业年间，圣域千年清净毁于一旦：杨广把东都修在墙外，把运河修到东墙，把「邀天子」发展成了每月保留节目——邀她看观风行殿、看六合板城、看运河通水、看灯会、看他新写的诗。教团千年来的谢客模板在他身上完全失效，因为他不按外交流程走，国书写得像街坊递帖子。最气人的是投喂精准：他知道她好机关，送来的将作监图纸一卷比一卷精巧，她拒绝得越来越慢。两人最终在运河码头见过一面（她坚持算「视察漕渠」不算赴约），杨广得意洋洋展示龙舟，问：「千年可曾见过如此手笔？」她看着运河上漕船如织，说了一句他到死才懂的话：「手笔孤见过更大的——纣王的鹿台，孤听先祖说过。**东西是好东西，就是这账不是这么记的：你记在功业上，民夫记在骨头上。两本账，早晚要对。**」大业十四年，江都兵变，杨广死于部下之手。消息传来，她让人把他历年送的图纸全部入库，架签写：「一个被皇位耽误的将作大匠。」","from":569,"to":618},{"cat":"隋唐","title":"玄奘·问神之西","keys":["玄奘","取经","西行","天竺","三藏"],"content":"贞观初，玄奘决意西行求法，偷渡出关前做了一件同样违禁的事：夜谒圣域（他连谒圣的资格审批都等不及）。被祧影「请」进去之后，他对她提的问题让千年守藏室档案里第一次出现「天子语塞」四字——他问：「陛下是东土之神。弟子要去的西方，可还有如陛下这样的……存在？佛国是真的吗？」她想起了八百年前那个扬帆的方士，说：「有个人替孤去东海看了，还没回来。西边——你去替孤看看。」她给了他一样东西：一小袋圣域的土，「走不动的时候，捏一捏，东边有人等你的答案」。十九年后玄奘归国，绕道洛阳还愿，带回的答案让她沉默了很久：「西方有法，无神如陛下者。弟子踏遍百国，陛下仍是弟子所知唯一的『例外』。」她最后问：「那袋土呢？」玄奘合十：「流沙河丢马时、雪山绝粮时，各捏过一次。剩下的，撒在了那烂陀寺的菩提树下——弟子想着，也算陛下到过了。」","from":602,"to":664},{"cat":"隋唐","title":"太宗·带血的手来求认证","keys":["李世民","太宗","玄武门","告命","贞观"],"content":"武德九年（626）玄武门之变，李世民杀兄弟、逼父退位，两个月后遣使洛阳求告命——使者战战兢兢，因为谁都知道这场帝位来路不正，而圣域千年阅尽篡夺。她的回复出乎所有人：准。亲谒之日，李世民在告命礼上忽然抬头直视她（礼制大忌），问：「陛下不问玄武门之事吗？」满殿死寂。她看着他放在膝上的手，说了千年告命史上最著名的一段话：「孤见过太多干净的手，握不住江山，最后害死的人比你杀的多十倍。你这双手脏了，但它知道疼——孤看得出来。**带着疼去治天下，比带着干净去糟蹋天下强。**去吧，别让孤看走眼。」李世民再拜，泪下。贞观一朝对圣域礼敬如师，太宗晚年常说：朕畏三件事——天、史笔、洛阳的眼睛。魏征谏诤最狠的时候都会补一句：「陛下若不听，臣就没办法了，只好请洛阳评理。」——通常很管用。","from":598,"to":649},{"cat":"隋唐","title":"李白·谒圣不得","keys":["李白","太白","谒圣不得","斗酒","将进酒"],"content":"开元年间李白初到东都，做了一件全洛阳都在等着看笑话的事：申请谒圣。资格审查毫无悬念地驳回（无谱牒、无官身、有酗酒记录）。李白当夜提着酒到圣域墙外，对着墙喝了个通宵，醉后以炭在墙砖上题诗一首《谒圣不得醉题圣域墙》，警跸的虎贲要抓人，带队的火长读了一遍诗，做了个改变文学史的决定：假装没看见。三日后奇事发生：那段墙被整体起下，换了新砖——旧砖不知去向。又三日，李白收到一份无落款的礼：一坛酒，酒是圣域祭典专用的千年古法秬鬯，坛底一行小字：「诗收下了。字太丑，配不上诗，练练。」李白狂喜三日，逢人便说天子夸我诗好，从此存了个执念，一生三过洛阳三次申请，三次被驳（审查标准里「酗酒记录」始终过不去）。那块题诗的墙砖，如今在守藏室，和司马迁、杜甫的卷子放在同一排。她的批注：「谪仙人是真的。可惜圣域的规矩管不了仙，只管得了酒。」","from":701,"to":762},{"cat":"隋唐","title":"上元灯夜·第一百八十一次微服","keys":["上元","灯节","微服","逛街成功"],"content":"她有一份千年私人耻辱账：微服逛街尝试一百八十次，成功零次——总在一炷香内被认出，然后全街下跪，尽兴而逃。开元二十四年上元灯节，第一百八十一次尝试，奇迹发生了：她逛完了整整一夜没被认出来。原因荒诞至极——那年洛阳灯会的爆款是「天子灯偶」：满街的人都戴着仿她的帷帽、穿着仿制玄端深衣招摇过市（民间早不知她真容，全凭想象），她混在几百个「假天子」里，成了最不显眼的一个。那一夜她和当代阿枣吃了胡饼、猜了灯谜（赢了一只兔子灯）、看了百戏、听一个说书人讲「周天子传奇」并当场指出七处错误（说书人赞她「小娘子懂行」）、最后在洛水边看了灯河。回宫后她把兔子灯挂在寝殿，谁都不许碰。次年教团酝酿取缔「天子灯偶」（渎神），被她以罕见的严厉否决：「取缔？孤明年还要去。**这是千年来天下第一次不跪着看孤——你们知道那有多好看吗？**」","from":618,"to":907},{"cat":"隋唐","title":"安史之乱·开门之夜","keys":["安史之乱","安禄山","难民","开门收人","铁律破例"],"content":"天宝十四载（755）安禄山反，叛军铁蹄直扑两京。次年正月洛阳（唐东都）陷落，屠掠三日，数十万百姓无处可逃——除了那道千年不开的门。圣域铁律：王朝战乱，中立，闭门。千年无例外——直到这一夜。难民潮涌到神人之门外时，她正站在城台上。大祧玄捧着典章刚说了半句「铁律」，她说：「铁律是孤立的。孤现在改一晚。」神人之门千年来第一次为庶民彻夜大开，一夜涌入难民十一万，圣域存粮以「千年积蓄，本无用处」的名义全部放出。而更奇的事在门外：叛军前锋追至三里界碑，勒马不前——安禄山本人的军令：「圣域绕行。」这位胡人反王比谁都清楚：他的兵敢屠洛阳，但让他们朝一千二百岁的神举刀，军心当场就会散。乱平后，十一万难民陆续归乡，每人领了一小袋圣域的米做路粮。此后河洛民间新增一条谚语，流传千年：「天塌了，往西走——西边有个不关门的神。」她在那夜的批注只有一句：「早该改了。」","from":703,"to":763},{"cat":"隋唐","title":"杜甫·配写史的又一个","keys":["杜甫","子美","三吏","诗史","谒圣域不入"],"content":"乾元二年（759），杜甫自洛阳赴华州，道经战后的河洛——新安道上抓丁、石壕村夜捉人、潼关筑城，他一路走一路写，《三吏》《三别》成了那场浩劫最疼的记录。路过圣域时他没有申请谒圣（他知道自己身份不够），只在墙外歇了一夜，望着墙内灯火写了一首《宿圣域墙外》，其中两句后来刻进了守藏室的门楣：「千年一炬外，灯火独人间。」诗随驿传流入圣域，她读完只问了一句：「写石壕村的也是他？」得到确认后，她做了千年来只为司马迁做过的事：命守藏室为在世之人立专卷收诗，逐年增补。批注：「司马迁配写史，是他问得对；这个人配写史，是他看得见——**看得见排队抓走的老妪，看得见新婚别的床。孤的书库千年收帝王将相，早该收几个看得见人的。**」杜甫至死不知此事。他死后半世纪，守藏室那一卷已是天下最全的杜诗集，卷名是她起的：《诗史》——这个说法后来流传天下，成了杜甫的定评。","from":712,"to":770},{"cat":"神格","title":"验神录·历代弑神未遂事件簿","keys":["验神","弑神","刺杀天子","验明正身","刺客"],"content":"千年来试图「验证」或终结她的人从未断绝，守藏室有一卷她亲自批注的《验神录》。精选战绩：鸩酒（前472，她喝完还续了一杯，批注「酿得不错」）；沉洛水（前389，绑石沉河，三日后她自己走上岸，批注「水底很安静，谢了」）；万箭（前301，某狂公子率死士射王城，她立城头未避，批注「准头堪忧」）；焚台（新莽年间，火烧三日，她从灰里走出来掸了掸袖子，批注「衣服是新做的，心疼」）；鼎烹未遂（始皇，另卷专记）。真正让她记进史册的只有一次：某无名刺客近身后忽然掷刀跪地大哭——「你活着，我娘就白死了吗」——那次她没有批注，只让守藏史记了一句：**「刺不死孤的是兵刃。」**每个时代的野心家都辗转求读过这卷录，读完基本就冷静了。教团曾请示销毁此录以绝效尤，她拒绝：「留着。这是孤和天下讲道理讲得最快的一卷书。」"},{"cat":"周室","title":"守祧暗部·祧影","keys":["祧影","暗部","影卫","神的脏活"],"content":"守祧教团的台面是繁文缛节，台下是另一回事：一支她从未批准、也从未成功解散的护卫暗部「祧影」。教义只有一句：**神不需要出手，脏活有信徒。**千年来死在圣域三里界外、连她名字都没来得及喊出口的「验神者」，数目是《验神录》的十倍。祧影每代首领继任时都会收到天子口谕「解散」，然后毕恭毕敬记录在案、供奉起来、继续干活——教团的逻辑无懈可击：神的仁慈也是神性，仁慈的代价由凡人支付即可。她对此的真实态度是千年里少数真正动过怒的事：她要的从来不是干净的世界，是知情权。而祧影千年唯一一次成功瞒住她的事，是烧掉了一份「已处理名单」——因为名单上有一个她认识的名字。**这件事到今天还没爆。**（叙事钩子：任何时代都可以让玩家撞见祧影的行动现场，或让那份烧掉的名单浮出水面。）"},{"cat":"神格","title":"圣域七不思议","keys":["七不思议","怪谈","夜半琴","禁架","洛水白衣"],"content":"洛邑孩童世代相传的七桩怪谈，每一桩背后都是她的日常被神化的过程：一、夜半琴——子夜宫苑有琴声，谁也找不到琴师（她失眠，弹琴，千年失眠千年弹）；二、洛水白衣——月夜洛水有白衣人踏波（她夜泳，教团求了八百年求不动）；三、守藏室禁架——书库最深处有一格谁碰谁遭天谴（其实只上了三道锁：里面是徐福的传闻、《验神录》原本和几封没头没尾的信）；四、不谢之花——宫苑有株花千年不谢（公输门做的机关绢花，每月有人换）；五、镜中人——宫中古镜偶尔照出多余的人影（镜子老了，铜锈而已，但她不许换，说「锈得像个故人」）；六、太庙夜语——无人的太庙深夜有人说话（真的是她，每年除夕去给列祖列宗汇报，一报千年）；七、第七桩——第七桩没人说得清内容，孩子们只知道口诀：「第七件，问阿枣，阿枣笑而不告。」（历代阿枣确实都知道。历代阿枣确实都不说。）"},{"cat":"核心","title":"枣氏千年列传","keys":["历代阿枣","枣氏列传","侍女传承","家训"],"content":"枣氏千年，代代出一个「阿枣」侍奉天子，家训一句：「王上不是神，是我们家侍奉的主人。」列传撷英——初代枣：王子朝之乱那夜举灯的小侍女，家训即她的遗训；战国那代「武枣」：军户出身，佩剑侍立，曾单人格杀闯宫刺客三人，《验神录》里有她的战绩批注（天子写的：「比虎贲能打」）；秦火那年的「书枣」：焚书令下，她带着守藏室学徒连夜抄书三月，手抄出茧，天下诗书因洛阳而不绝；永嘉之夜的「刀枣」：刘曜兵临，她提着厨刀站在天子身后，说家训没说不许；安史那夜的「粥枣」：十一万难民入城，她掌粮秣分配，三日三夜未眠，账目分毫不差；开元年间的「灯枣」：陪天子完成千年来第一次成功的微服逛街，替她拎着赢来的兔子灯。天子为枣氏立过一条圣域独一无二的规矩：枣氏女可以随时辞职，嫁人、经商、远游，圣域出资——千年来，没有一个走的。她们的说法代代相同：「别家侍奉的主人会死，我家的不会。这活儿干着有盼头。」"}]}</script>

/* 图片版本模型：每次 draw/重绘 = 一个版本；版本内 1 张=单图、≥2 张=一次性多图（网格）。
   箭头只在版本间翻，只显示当前版本，旧图仅供翻看。兼容旧扁平 imgs（每张迁移为独立版本）。 */
function imgVers(h){
  if(h.imgVers&&h.imgVers.length)return h.imgVers;
  if(h.imgs&&h.imgs.length){h.imgVers=h.imgs.map(function(id){return [id];});h.verIx=(h.imgIx!=null?Math.min(h.imgIx,h.imgVers.length-1):h.imgVers.length-1);return h.imgVers;}
  if(h.img){h.imgVers=[[h.img]];h.verIx=0;return h.imgVers;}
  return null;

/* iOS 风「缩放」图标（viewfinder 四角描边，非 emoji），点击在迷你/小/中/大循环。pointer-events:none 让点击必落到按钮本身、不穿透到图片（防误触全屏） */
function zoomIcon(s){s=s||16;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:block;pointer-events:none"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5V9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20H9"/></svg>';}
/* ---------- 生成等待·启发式进度条 ----------
   接口在吐第一个字前不给任何进度信号，无法真·倒计时；故用【本机最近几轮的首字耗时中位数】作预估，
   进度条按预估渐近爬升（永不虚假到 100%，出字才冲满），文案写在条上：太史令落笔中…已等待 X 秒（通常约 N 秒）。
   自驱动：监测 S.thinking/S.fixing 的真↔假跳变来量测耗时，无需改生成流程。 */
var GEN={t0:0,est:0,active:false,mode:'',samples:(function(){try{var a=JSON.parse(localStorage.getItem('zhouji_ttft_v1')||'[]');return Array.isArray(a)?a.slice(-8):[];}catch(e){return [];}})()};
function ttftMedian(){var a=GEN.samples.slice().sort(function(x,y){return x-y;});return a.length<1?0:a[Math.floor(a.length/2)];}
/* 进度百分比与条上文案（markup 与动画共用一套计算，保证每次渲染都正确） */
function genPct(){var el=Date.now()-GEN.t0,est=(GEN.mode==='gen'&&GEN.est)?GEN.est:9000;return Math.min(94,Math.max(5,(1-Math.exp(-el/(est*0.55)))*100));}
function genLabel(){var el=Date.now()-GEN.t0,s=(el/1000).toFixed(el<10000?1:0);
  if(GEN.mode==='fix')return '太史令补录状态栏中…已等待 '+s+' 秒';
  if(GEN.est)return (el>GEN.est*1.6)?('太史令落笔中…已等待 '+s+' 秒 · 较慢，请稍候'):('太史令落笔中…已等待 '+s+' 秒（通常约 '+Math.max(1,Math.round(GEN.est/1000))+' 秒）');
  return '太史令落笔中…已等待 '+s+' 秒（首次通常较慢）';}
/* busy 上升/下降沿检测（markup 每次渲染 + genTick 每 200ms 共同驱动，200ms 采样天然桥接亚帧抖动）：
   - 上升沿（开始生成）：置 t0、按历史算预估、清 done 标记。
   - 下降沿（首字到达/结束）：记一条首字耗时样本（仅正文生成、且耗时合理时）。
   返回 busy 供 markup 判断是否显示进度条。 */
function genSync(){
  var busy=!!(typeof S!=='undefined'&&(S.thinking||S.fixing)),now=Date.now();
  if(busy&&!GEN.active){GEN.active=true;GEN.t0=now;GEN.mode=(S.fixing&&!S.thinking)?'fix':'gen';GEN.est=ttftMedian();GEN.done=false;}
  else if(!busy&&GEN.active){GEN.active=false;
    if(!GEN.done&&GEN.mode==='gen'){var dt=now-GEN.t0;if(dt>=250&&dt<=90000){GEN.samples.push(dt);if(GEN.samples.length>8)GEN.samples=GEN.samples.slice(-8);try{localStorage.setItem('zhouji_ttft_v1',JSON.stringify(GEN.samples));}catch(e){}}}GEN.done=true;}
  return busy;
}
function genTick(){var busy=genSync();if(busy){var fill=document.getElementById('zjGenFill'),txt=document.getElementById('zjGenTxt');if(fill)fill.style.width=genPct().toFixed(1)+'%';if(txt)txt.textContent=genLabel();}}
try{setInterval(genTick,200);}catch(e){}
function ensureTyping(){
  if(!TYPE.msg||typedSet.has(TYPE.msg)){return;}
  if(TYPE.timer){return;}
  TYPE.timer=setInterval(function(){
    if(!TYPE.msg||typedSet.has(TYPE.msg)){clearInterval(TYPE.timer);TYPE.timer=null;return;}
    TYPE.pos+=2;
    if(TYPE.pos>=TYPE.full.length){TYPE.pos=TYPE.full.length;typedSet.add(TYPE.msg);clearInterval(TYPE.timer);TYPE.timer=null;renderSoft();return;}
    var box=document.getElementById('zjTypeBox');
    if(box){box.innerHTML=worldParas(TYPE.full,TYPE.pos)+'<span class="tcursor">▍</span>';}
    var st=document.getElementById('zjStory');if(st)st.scrollTop=st.scrollHeight;
  },20);
}

var GL={done:false,tries:0};
function glInit(){
  if(GL.done)return;
  if(!window.THREE){ if(GL.tries++<40) setTimeout(glInit,200); return; }
  var cv=document.getElementById('zjGL'); if(!cv)return;
  try{
    var T=window.THREE, W=window.innerWidth, H=window.innerHeight;
    var rnd=new T.WebGLRenderer({canvas:cv,alpha:false,antialias:true});
    rnd.setClearColor(0x0d0a08,1); /* 不透明底色与页面同色：加法混合不再污染合成alpha，根治光斑黑印 */
    rnd.setPixelRatio(LOWFX?1:Math.min(2,window.devicePixelRatio||1)); rnd.setSize(W,H);
    GL.applyLow=function(on){try{rnd.setPixelRatio(on?1:Math.min(2,window.devicePixelRatio||1));rnd.setSize(window.innerWidth,window.innerHeight);}catch(e){}};
    var scene=new T.Scene(); var cam=new T.PerspectiveCamera(60,W/H,.1,1000); cam.position.z=60;
    /* 弥散暖雾光斑贴图：白→黑全不透明渐变（加法混合下黑=消散，规避预乘alpha脏点） */
    var glsp=(function(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');
      x.fillStyle='#000';x.fillRect(0,0,64,64);
      var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#ffffff');g.addColorStop(.3,'#808080');g.addColorStop(.7,'#1f1f1f');g.addColorStop(1,'#000000');
      x.fillStyle=g;x.fillRect(0,0,64,64);
      var t9=new T.CanvasTexture(c);try{t9.colorSpace='srgb';}catch(e9){}return t9;})();
    function field(n,size,color,op,spread){var pos=new Float32Array(n*3);for(var i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*spread;pos[i*3+1]=(Math.random()-.5)*spread*1.15;pos[i*3+2]=(Math.random()-.5)*70;}var g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));var m=new T.PointsMaterial({color:color,size:size,map:glsp,transparent:true,opacity:op,blending:T.AdditiveBlending,depthWrite:false});var p=new T.Points(g,m);scene.add(p);return {g:g,p:p,n:n};}
    var f1=field(680,2.6,0xe0a45e,0.55,150), f2=field(120,5.6,0xffd9a0,0.85,130);
    GL.done=true;
    window.addEventListener('resize',function(){var w=window.innerWidth,h=window.innerHeight;cam.aspect=w/h;cam.updateProjectionMatrix();rnd.setSize(w,h);});
    var t0=Date.now(),glLast=0;
    (function loop(){
      requestAnimationFrame(loop);
      if(LOWFX){
        if(document.hidden)return;
        if(window.__ZJSCR==='game')return; /* 游戏内被正文全幅覆盖，白画 */
        var nw9=Date.now();if(nw9-glLast<33)return;glLast=nw9; /* 锁30帧 */
      }
      var dt=(Date.now()-t0)/1000;
      [f1,f2].forEach(function(f,idx){var a=f.g.attributes.position.array;var v=idx?0.11:0.06;for(var k=0;k<f.n;k++){a[k*3+1]+=v;if(a[k*3+1]>85)a[k*3+1]=-85;a[k*3]+=Math.sin(dt*.4+k)*0.004;}f.g.attributes.position.needsUpdate=true;f.p.rotation.y=Math.sin(dt*.05)*.12;});
      cam.position.x=Math.sin(dt*.06)*4; cam.lookAt(0,0,0);
      rnd.render(scene,cam);
    })();
  }catch(e){}
}

function parseMvu(text){
  text=String(text||'');
  var m = /<mvu_panel>([\s\S]*?)<\/mvu_panel>/.exec(text);
  var block;
  if(m){block=m[1];}
  else{var m2=/<mvu_panel>([\s\S]*)$/.exec(text); /* 容错：缺失闭合标签 */
    if(m2){block=m2[1];}
    else if(/<sec_(?:char|npc|world)>/.test(text)){block=text;} /* 容错：缺失外层包裹 */
    else{return null;}}
  function sec(n){var s=new RegExp('<sec_'+n+'>([\\s\\S]*?)</sec_'+n+'>').exec(block);return s?s[1]:'';}
  function lines(src,mk){return src.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.indexOf(mk)===0;}).map(function(l){return l.slice(1).split('|').map(function(p){return p.trim();});});}
  var char={},world={};
  lines(sec('char'),'◆').forEach(function(a){char[a[0]]=a.slice(1).join('|');});
  lines(sec('world'),'◇').forEach(function(a){world[a[0]]=a.slice(1).join('|');});
  var npcs = lines(sec('npc'),'◈').map(function(p){return {name:p[0]||'',state:p[1]||'',favor:parseInt(p[2],10)||0,thought:p[3]||'',role:p[4]||'',place:p[5]||'',age:p[6]||'',sex:p[7]||''};});
  return {char:char,npcs:npcs,world:world};
}
function stripMvu(t){return String(t||'')
  .replace(/<mvu_panel>[\s\S]*?<\/mvu_panel>/g,'')            /* 完整状态栏 */
  .replace(/<UpdateVariable>[\s\S]*?<\/UpdateVariable>/g,'')
  .replace(/<mvu_panel>[\s\S]*$/,'')                          /* 流式：尚未闭合的半截状态栏 */
  .replace(/<sec_[a-z]*>[\s\S]*$/i,'')                        /* 流式：漏了外层包裹、直冒出的 <sec_…> */
  .replace(/\n*<\/?[a-z_]{0,14}$/i,'')                        /* 流式：末尾正在逐字成形的半个标签，如 <mvu_pane */
  .trim();}
/* 去复读退化：Gemini 等模型偶发"极其极其极其…"式无尽复读，客户端兜底压平 */
function deLoop(t){
  t=String(t||'');
  t=t.replace(/(.)\1{9,}/g,function(m,c){return c+c+c;}); /* 单字连刷≥10 → 3 */
  t=t.replace(/([\s\S]{2,12}?)\1{5,}/g,function(m,g){return g+g+g;}); /* 2-12字短语连刷≥6 → 3 */
  return t;
}
function parseDeed(text){
  var m=/<sec_deed>([\s\S]*?)<\/sec_deed>/.exec(text||'');
  if(!m)return null;
  var out={build:[],raze:[],come:[],go:[]};
  var map={'兴作':'build','毁损':'raze','来者':'come','去者':'go'};
  m[1].split('\n').forEach(function(l){
    l=l.trim();if(l.charAt(0)!=='▣')return;
    var pp=l.slice(1).split('|');var k=map[(pp[0]||'').trim()];if(!k||!pp[1])return;
    pp[1].split(/[、,，;；]/).forEach(function(it){
      it=it.trim();if(!it||it==='无')return;
      var mm=/^(.+?)[×xX*]\s*(\d+)$/.exec(it);
      out[k].push({name:mm?mm[1].trim():it,n:mm?Math.min(5,parseInt(mm[2],10)||1):1});
    });
  });
  return (out.build.length||out.raze.length||out.come.length||out.go.length)?out:null;
}
function deedHash(t){var h=5381;t=String(t||'');for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36);}
function edictSync(){

function scanLore(recent,budget,history,userInput){
  budget = budget||9000; var out=[],used=0;
  var op=currentOpening(); var now=(op&&typeof op.year==='number')?op.year:null;
  /* 按开局朝代供电：未来条目硬关断（防剧透防穿越）；本朝条目优先装桶；
     已成过去的条目降级为「千年记忆」，仅在被提及时排在末位注入。
     兼容 ST 高级字段：次级关键词(须同时命中)、注入顺序、触发概率、扫描深度、递归扫描 */
  function future(e){return now!==null&&typeof e.from==='number'&&e.from>now;}
  function past(e){return now!==null&&typeof e.to==='number'&&e.to<now;}
  function push(e){if(out.indexOf(e)>=0)return;if(used+e.content.length<=budget){out.push(e);used+=e.content.length;}}
  function textAt(e){
    if(!e.depth||!history)return recent;
    return history.slice(-e.depth).map(function(h){return h.text;}).join('\n')+'\n'+(userInput||'');
  }
  function hitBy(e,txt){
    if(!(e.keys||[]).some(function(k){return k&&txt.indexOf(k)>=0;}))return false;
    if(e.keys2&&e.keys2.length&&!e.keys2.some(function(k){return k&&txt.indexOf(k)>=0;}))return false;
    return true;
  }
  function pass(e){return e.prob==null||Math.random()*100<e.prob;}
  var UL=ULORE.filter(function(e){return e.on!==false&&e.content;});
  var L=(G.lorebook||[]).concat(UL).filter(function(e){return !future(e);});
  L.forEach(function(e){if(e.constant&&pass(e)) push(e);});
  L.forEach(function(e){ /* 各朝【指南】：命中当前年代即常驻，不靠关键词 */
    if(!e.constant&&e.pin&&now!==null&&typeof e.from==='number'&&e.from<=now&&(typeof e.to!=='number'||now<=e.to)) push(e);
  });
  var cand=L.filter(function(e){return !e.constant&&!e.pin&&e.cat!=='InitVar'&&e.cat!=='MVU';});
  var hit=cand.filter(function(e){return hitBy(e,textAt(e))&&pass(e);});
  /* 递归扫描：已激活条目的内容可再点亮其他条目（一层，防环） */
  var rtxt=out.concat(hit).filter(function(e){return !e.prevR;}).map(function(e){return e.content;}).join('\n');
  if(rtxt)cand.forEach(function(e){if(hit.indexOf(e)>=0||out.indexOf(e)>=0||e.exclR)return;if(hitBy(e,rtxt)&&pass(e))hit.push(e);});
  hit.sort(function(a,b){return (a.order==null?100:a.order)-(b.order==null?100:b.order);});
  hit.filter(function(e){return !past(e);}).forEach(push);
  hit.filter(past).forEach(push);
  return out;
}

function ttsChunks(t,n){

/* ---------------- 长程记忆 · 太史长卷 ----------------
   每轮世界回应自动摘为一条编年纪要（纪年·时地·天子之举·史笔），永久保存、
   每轮全量注入系统提示——正文历史再怎么被截断，既定事实也不会丢。 */
function memFp(t){var h=5381,str=String(t||'').slice(0,120);for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return h;}
function worldOrdinal(i){var c=-1;for(var k=0;k<=i&&k<S.history.length;k++)if(S.history[k].role==='world')c++;return c;}
function memWorldIdx(j){var c=-1;for(var i=0;i<S.mem.length;i++){if(!S.mem[i].manual){c++;if(c===j)return i;}}return -1;}
function memEntryOf(worldMsg,actText){
  var p=worldMsg.panel||parseMvu(worldMsg.text);
  var line=(p&&p.char&&p.char['史笔'])||'';
  if(!line)line=applyRegex(stripCoT(stripMvu(worldMsg.text)),'prompt').replace(/\s+/g,' ').slice(0,70);
  return {e:p&&p.world?(p.world['纪年']||''):'',d:p&&p.world?(p.world['时地']||''):'',
    a:String(actText||'').replace(/\s+/g,' ').slice(0,40),s:String(line).replace(/\s+/g,' ').slice(0,90),fp:memFp(worldMsg.text)};
}
function memSync(){
  if(!S.mem)S.mem=[];
  var worlds=[],acts=[];
  for(var i=0;i<S.history.length;i++){
    var h=S.history[i];
    if(h.role==='world'){worlds.push(h);acts.push(i>0&&S.history[i-1].role==='user'?S.history[i-1].text:'');}
  }
  var n=S.memN||0;
  if(worlds.length<n){ // 历史被重开/回退（重演此幕、删幕、由此幕重来）
    /* 裁掉末尾多出的非手记纪要，使其与世界回合数对齐；手记保留。
       否则空回复重演等场景会残留孤儿纪要，与随后追加的新纪要重复并挤掉前一条真记忆 */
    var nonM=0;for(var q=0;q<S.mem.length;q++)if(!S.mem[q].manual)nonM++;
    var mch=false;
    while(nonM>worlds.length){for(var r2=S.mem.length-1;r2>=0;r2--){if(!S.mem[r2].manual){S.mem.splice(r2,1);nonM--;mch=true;break;}}}
    S.memN=worlds.length;if(mch)savePref();return;
  }
  var changed=false;
  // 重演此幕：条数未增但末条内容换了 → 更新末条
  if(worlds.length===n&&n>0&&S.mem.length&&S.mem[S.mem.length-1].fp!==memFp(worlds[n-1].text)&&!S.mem[S.mem.length-1].manual){
    S.mem[S.mem.length-1]=memEntryOf(worlds[n-1],acts[n-1]);changed=true;
  }
  for(var j=n;j<worlds.length;j++){S.mem.push(memEntryOf(worlds[j],acts[j]));changed=true;}
  if(worlds.length!==n){S.memN=worlds.length;changed=true;}
  if(changed)savePref();
}
function memChronicle(cap){
  cap=cap||7000;
  var lines=S.mem.map(function(m,i){
    var head=(m.e||'')+(m.d?('·'+m.d):'');
    return (i+1)+'. '+(head?('『'+head+'』'):'')+(m.a?('天子'+(m.manual?'手记':'之举')+'：'+m.a+'。'):'')+(m.s?('史载：'+m.s):'');
  });
  var total=lines.join('\n');
  if(total.length<=cap)return total;
  var keepHead=Math.min(8,lines.length);
  var head=lines.slice(0,keepHead),tail=[],used=head.join('\n').length+20;
  for(var i=lines.length-1;i>=keepHead;i--){if(used+lines[i].length>cap)break;tail.unshift(lines[i]);used+=lines[i].length+1;}
  return head.join('\n')+'\n……（中略 '+(lines.length-keepHead-tail.length)+' 条，已录于长卷）……\n'+tail.join('\n');
}

/* 断续自动补全：状态栏恒在正文末尾，故「缺失或不完整的 mvu_panel」即「被截断或漏写」的可靠信号。
   命中时自动续写一次，接着把话说完并补齐状态栏，从根上避免「变量不更新 / AI截断」两类问题。 */
function panelComplete(t){var p=parseMvu(t);return !!(p&&p.world&&Object.keys(p.world).length&&p.char&&Object.keys(p.char).length);}
function speedOn(){return !!(API.gen&&API.gen.speed==='1');} /* 极速模式：牺牲正文/变量/记忆/演绎质量，换更快出字。默认关——满血全配置 */
function autofixOn(){return !(API.gen&&API.gen.autofix==='0')&&!speedOn();} /* 断续自动补全开关，默认开；极速模式下不补 */
function ensureComplete(sys,msgs,t){
  if(S.chatOnly||!t||!apiReady()||!autofixOn()||panelComplete(t))return Promise.resolve(t); /* 关闭 / 聊天模式 / 已完整 → 不补 */
  S.fixing=true;renderSoft(); /* 亮出「太史令补录状态栏中…」 */
  var ask='（上一段疑似被截断或漏写了结尾状态栏。请紧接上文把话说完，并在末尾据实补齐完整<mvu_panel>：<sec_char>含◆衣冠/持物/御体/观瞻/神格/史笔；<sec_npc>每在场者一行◈名字|状态|好感|心声|身份|所在|年龄|性别（后四项据剧情如实填，不明可留空但保留竖线占位）；<sec_world>含◇纪年/时地/天气/安稳/大势/将临。只输出续写与状态栏，不要重复已写过的内容。）';
  var cont=msgs.concat([{role:'assistant',content:t},{role:'user',content:ask}]);
  return callCustomAI(sys,cont).then(function(t2){
    S.fixing=false;
    if(!t2||!String(t2).trim())return t;
    var head=String(t).replace(/<mvu_panel>[\s\S]*$/,'').replace(/\s+$/,''); /* 去掉可能的半截状态栏 */
    var merged=head+'\n\n'+String(t2).trim();
    return panelComplete(merged)?merged:t; /* 补全仍失败则保留原文，绝不劣化 */
  },function(){S.fixing=false;return t;});
}
/* 手动重 roll 格式：仅据本幕正文重新生成结尾状态栏，正文一字不动。掉格式时用。 */

  var cont=msgs.concat([{role:'assistant',content:h.text},{role:'user',content:ask}]);
  S.fixing=true;S.fixingIdx=idx;S._noFade=true;render();
  callCustomAI(sys,cont).then(function(t2){

    if(panelTxt){var newText=narr+'\n'+panelTxt;var p=parseMvu(newText);
      if(p&&p.world&&Object.keys(p.world).length&&p.char&&Object.keys(p.char).length){h.text=newText;h.panel=p;try{memSync();}catch(e){}savePref();}

function advanceLocal(base,text){
  var done=function(reply,live){

    if(S._swipeFrom){msg.alts=S._swipeFrom.concat([reply]).slice(-8);msg.altIx=msg.alts.length-1;S._swipeFrom=null;}
    S.thinking=false;S.aiLive=live;S.history=base.concat([{role:'user',text:text},msg]);render();savePref();
    if(live)genSuggestions();

  };
  var claudeOK = window.claude && typeof window.claude.complete==='function';
  if(apiReady()){
    S._genCancel=false;try{GENAC=new AbortController();}catch(e){GENAC=null;}
    var sys=buildSystem(base,text),msgs=buildMessages(base,text);
    var fail=function(err){if(S._genCancel){S._genCancel=false;GENAC=null;S.thinking=false;render();return;}done('【API 调用失败】'+(err&&err.message?err.message:String(err))+'\n\n请点击右上角「链」核对接口地址、密钥与模型名，然后点「重演此幕」重试本回合。',false);};
    var plain=function(){callCustomAI(sys,msgs).then(function(t){if(!t||!String(t).trim())throw new Error('接口返回了空回复（可能被内容过滤或模型名不对）');return ensureComplete(sys,msgs,t);}).then(function(t){done(t,true);}).catch(fail);};
    if(API.gen&&API.gen.stream!=='0'&&window.ReadableStream){
      var live={role:'world',text:'',panel:null};var started=false,lastR=0;
      callCustomAIStream(sys,msgs,function(full){
        live.text=full;
        if(!started){started=true;S.thinking=false;S.aiLive=true;S.history=base.concat([{role:'user',text:text},live]);render();lastR=Date.now();}
        else if(Date.now()-lastR>650){lastR=Date.now();renderSoft();}
        /* 早启生图：正文还在流式输出时，一旦场景文字够了就先动手画，不等整段写完，抵消生图延迟 */
        if(started&&IMGCFG.on&&IMGCFG.auto&&imgReady()&&!live._earlyDraw&&S.imgBusy==null&&(parseInt(IMGCFG.count,10)||1)<=1){
          var _nar=stripCoT(stripMvu(full)).replace(/^【[^】]*】/,'').replace(/\s/g,'');
          if(_nar.length>=90){live._earlyDraw=true;var _lx=S.history.indexOf(live);if(_lx>=0)drawWorld(_lx);}
        }
      }).then(function(t){
        if(!t||!String(t).trim())throw new Error('接口返回了空回复');
        return ensureComplete(sys,msgs,t).then(function(t3){
          t3=deLoop(t3);live.text=t3;live.panel=parseMvu(t3);S.thinking=false;S.aiLive=true;
          if(S._swipeFrom){live.alts=S._swipeFrom.concat([t3]).slice(-8);live.altIx=live.alts.length-1;S._swipeFrom=null;}
          if(!started)S.history=base.concat([{role:'user',text:text},live]);
          GENAC=null;render();savePref();genSuggestions();maybeAutoDraw();
        });
      }).catch(function(){
        /* 用户取消：撤下半截、静默收场，不重试不报错 */
        if(S._genCancel){S._genCancel=false;GENAC=null;if(started){var lxc=S.history.indexOf(live);if(lxc>=0)S.history.splice(lxc,1);}S.thinking=false;S.aiLive=false;render();savePref();return;}
        /* 流式中断：撤下半截，回退整段生成重试一次 */
        if(started){var lx=S.history.indexOf(live);if(lx>=0)S.history.splice(lx,1);}
        S.thinking=true;render();

      });

    }

    var body={model:'claude-sonnet-4-5',max_tokens:4000,system:buildSystem(base,text),messages:buildMessages(base,text)};

/* 重演开局：开局是 history[0]、其前没有玩家输入，无法走 advanceLocal，故单开一路——让 AI 依本局设定重写开场，
   保留历稿以便翻看；若其后已有剧情则先确认（会全部舍弃、等于换个开场重新开始）。 */
function rerollOpening(){
  var h=S.history;
  if(S.thinking||!h.length||h[0].role!=='world')return;
  if(!apiReady()){S.apiMsg={t:'请先在「链」配置 AI 接口后再重演开局。',c:'var(--red2)'};if(S.overlay)renderOverlay();else render();return;}
  if(h.length>1&&!confirm('重演开局将舍弃其后的全部剧情，并重新生成开场。确定吗？'))return;
  var op=currentOpening();var oldW=h[0];
  S._swipeFrom=(oldW.alts&&oldW.alts.length?oldW.alts.slice():[oldW.text]).slice(-7);
  S.mem=[];S.memN=0;S._genCancel=false;try{GENAC=new AbortController();}catch(e){GENAC=null;}
  S.thinking=true;S.history=[];render();
  var sys=buildSystem([],'（开场）');
  var ask='请为本局重新撰写【开场白】：以现代白话轻小说笔法写一段开场正文（2-6段），交代'+(op&&op.scene?('「'+op.scene+'」'):'本局')+'的时地、场面与在场人物，把玩家（周天子姬瑶）自然带入，停在需要天子表态处；末尾必须输出完整 <mvu_panel> 状态栏（含 <sec_char>/<sec_npc>/<sec_world>，规则同平时）。只输出正文与状态栏，不要复述指令、不要写玩家的话。';
  var msgs=[{role:'user',content:ask}];
  var fin=function(reply){GENAC=null;reply=deLoop(reply);var msg={role:'world',text:reply,panel:parseMvu(reply)};if(S._swipeFrom){msg.alts=S._swipeFrom.concat([reply]).slice(-8);msg.altIx=msg.alts.length-1;S._swipeFrom=null;}S.thinking=false;S.history=[msg];render();savePref();maybeAutoDraw();};
  var back=function(){GENAC=null;S._genCancel=false;S.thinking=false;S.history=[oldW];S._swipeFrom=null;render();savePref();};
  callCustomAI(sys,msgs).then(function(t){if(!t||!String(t).trim())throw new Error('接口空回复');return ensureComplete(sys,msgs,t);}).then(fin).catch(back);
}
function reroll(idx){
  var h=S.history;
  if(S.thinking||!h.length)return;
  if(idx==null){for(idx=h.length-1;idx>=0&&h[idx].role!=='world';idx--){}}
  if(idx<0||!h[idx]||h[idx].role!=='world')return;
  if(idx===0){rerollOpening();return;}
  if(h.length<2)return;
  var isLast=(idx===h.length-1);
  /* 旧幕重演会舍弃其后剧情——先确认 */
  if(!isLast&&!confirm('重演此幕将舍弃其后的剧情，确定重新演绎这一幕吗？'))return;
  if(isLast&&TH.available){
    if(TH.triggerSlash){S.thinking=true;render();try{TH.triggerSlash('/swipe');}catch(e){}setTimeout(pullHistory,1500);}
    return;
  }
  // local: need preceding user
  if(h[idx-1].role!=='user')return;
  var user=h[idx-1];var base=h.slice(0,idx-1);
  var oldW=h[idx];
  /* 仅最后一幕累积历稿；旧幕重演另起 */
  S._swipeFrom=isLast?(oldW.alts&&oldW.alts.length?oldW.alts.slice():[oldW.text]).slice(-7):null;
  S.thinking=true;S.history=h.slice(0,idx);render();
  advanceLocal(base,user.text);
}

function parseShareCode(txt){

/* 滚动位置保全（通用）：重建前记下容器内各滚动条位置，重建后按「标签+类名+同类序号」原位恢复。
   不能按元素序号对位：胶囊等动态节点会让新旧DOM序号错位，导致画面弹回顶部。
   —— 这是根治「点一下就闪屏/画面弹到最上面」的公共底座，render 与 renderOverlay 共用。 */
function _scrKey(el){return el.tagName+'|'+(el.getAttribute('class')||'');}
function scrollCapture(root){var sv=[],cnt={},all=root.getElementsByTagName('*'),i,k;
  for(i=0;i<all.length;i++){k=_scrKey(all[i]);cnt[k]=(cnt[k]||0)+1;
    if(all[i].scrollTop||all[i].scrollLeft)sv.push([k,cnt[k]-1,all[i].scrollTop,all[i].scrollLeft]);}
  return sv;}
function scrollRestore(root,sv){if(!sv||!sv.length||!root)return;var all=root.getElementsByTagName('*'),cnt={},i,k;
  for(i=0;i<all.length;i++){k=_scrKey(all[i]);var n=(cnt[k]=(cnt[k]||0)+1)-1;
    for(var j=0;j<sv.length;j++){if(sv[j][0]===k&&sv[j][1]===n){all[i].scrollTop=sv[j][2];all[i].scrollLeft=sv[j][3];}}}}
function renderOverlay(){
  var box=document.getElementById('zjOvBox');
  if(!box||!S.overlay){render();return;}
  var tmp=document.createElement('div');
  tmp.innerHTML=overlayView();
  var fresh=tmp.querySelector('#zjOvBox');
  if(fresh){
    var sv=scrollCapture(box);
    box.innerHTML=fresh.innerHTML;
    scrollRestore(box,sv);
    codexPills();setPills();try{imgHydrate();}catch(e){}
  }else render();
}

function npcStats(){
  var map={},order=[];
  S.history.forEach(function(h){
    if(h.role!=='world')return;
    var p=h.panel||(h.panel=parseMvu(h.text));
    if(!p||!p.npcs)return;
    p.npcs.forEach(function(np){
      if(!np||!np.name)return;
      if(!map[np.name]){map[np.name]={name:np.name,n:0};order.push(np.name);}
      var o=map[np.name];o.n++;
      if(np.favor!=null)o.favor=np.favor;
      if(np.state)o.status=np.state;
      if(np.thought)o.thought=np.thought;
      if(np.role)o.role=np.role;
      if(np.place)o.place=np.place;
      if(np.age)o.age=np.age;
      if(np.sex)o.sex=np.sex;
    });
  });
  /* 老存档修复：早于本次更新开的局，存档里的开场面板仍是旧四字段。
     从当前开局定义(G.openings，代码内恒为新版八字段)按名补齐，无需重开局、无需AI。 */
  var pre=presetNpcMeta();
  var meta=S.npcMeta||{};
  return order.map(function(k){var o=map[k];
    var pm=pre[k];if(pm){if(!o.role&&pm.role)o.role=pm.role;if(!o.place&&pm.place)o.place=pm.place;if(!o.age&&pm.age)o.age=pm.age;if(!o.sex&&pm.sex)o.sex=pm.sex;}
    var mm=meta[k];if(mm){if(!o.role&&mm.role)o.role=mm.role;if(!o.place&&mm.place)o.place=mm.place;if(!o.age&&mm.age)o.age=mm.age;if(!o.sex&&mm.sex)o.sex=mm.sex;}
    return o;}).filter(function(o){return (S.graphHidden||[]).indexOf(o.name)<0;});
}
/* 当前开局定义里的 NPC 资料（身份/所在/年龄/性别），按名索引——用于修复旧存档 */
function presetNpcMeta(){
  try{

function pvPanel(){
  if(!PV)return '<div style="margin-top:18px;border-top:1px solid rgba(201,160,99,.18);padding-top:14px;font-size:12.5px;color:var(--mut);line-height:1.8">尚无请求记录。发一回合正文（或点「测试连接」）之后，这里就能看到实际发送给模型的完整提示词与用量估算。</div>';
  var msgs=PV.messages||[],totalM=0;
  msgs.forEach(function(m){totalM+=String(m.content||'').length;});
  var totalS=String(PV.system||'').length;
  var det=function(t,n,body){return '<details style="border:1px solid rgba(201,160,99,.18);border-radius:9px;padding:7px 11px;margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--gold3)">'+t+' <span style="color:var(--mut);font-size:11px">'+n+'字</span></summary><div style="font-size:11.5px;color:#8a7a5e;line-height:1.75;white-space:pre-wrap;word-break:break-all;margin-top:6px;max-height:220px;overflow-y:auto">'+esc(body)+'</div></details>';};

    +'<div style="font-size:12px;letter-spacing:.2em;color:var(--gold);margin:14px 0 2px">对话消息 · '+msgs.length+' 条</div>'+mh+'</div>';
}

/* 极速模式开关：置于「链」标签最下面。on=亮光发光、off=全灰。默认关（满血全配置）。 */
function speedToggle(){
  var on=speedOn();
  return '<div style="margin-top:26px;padding-top:20px;border-top:1px solid rgba(201,160,99,.18)">'
    +'<div data-act="toggleSpeed" role="switch" aria-checked="'+on+'" style="cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 17px;border-radius:15px;border:1px solid '+(on?'rgba(224,190,130,.7)':'rgba(201,160,99,.2)')+';background:'+(on?'linear-gradient(135deg,rgba(255,214,140,.14),rgba(201,140,70,.07))':'rgba(255,255,255,.02)')+';'+(on?'box-shadow:0 0 24px rgba(224,170,90,.26),inset 0 1px 0 rgba(255,240,210,.14);':'')+'transition:all .25s">'
      +'<div style="flex:1;min-width:0">'
        +'<div style="display:flex;align-items:center;gap:9px">'
          +'<span style="display:inline-flex;width:22px;height:22px;flex:none">'+bolt(on)+'</span>'
          +'<span style="font-family:var(--kai);font-size:16px;letter-spacing:.16em;color:'+(on?'var(--gold2)':'var(--mut)')+'">极速模式</span>'
          +'<span style="font-size:12.5px;letter-spacing:.04em;color:#e6795f;font-weight:600;display:inline-flex;align-items:center;gap:2px">（'+warn(12,'#e6795f')+'慎开）</span>'
          +'<span style="font-size:11px;letter-spacing:.24em;font-weight:700;color:'+(on?'#ffdca0':'var(--mut)')+';'+(on?'text-shadow:0 0 10px rgba(255,200,110,.6)':'opacity:.55')+'">'+(on?'ON':'OFF')+'</span>'
        +'</div>'
        +'<div style="font-size:11.5px;line-height:1.78;color:var(--mut);margin-top:7px">觉得出字太慢？开启后大幅精简提示词、缩短上下文与长程记忆、去掉示例与自查、不再自动补全状态栏——出字更快；代价是<b style="color:#d9a06a">正文、变量、记忆与角色扮演质量都会下降</b>。默认关闭，满血全配置、绝不缩水；此项只为等不及的玩家留一个选择。</div>'
      +'</div>'
      +'<div style="flex:none;width:52px;height:30px;border-radius:15px;position:relative;background:'+(on?'linear-gradient(135deg,#e0be82,#c8944a)':'rgba(120,110,92,.32)')+';border:1px solid '+(on?'rgba(255,230,180,.7)':'rgba(255,255,255,.13)')+';'+(on?'box-shadow:0 0 14px rgba(224,170,90,.5);':'')+'transition:all .25s">'
        +'<div style="position:absolute;top:2px;left:'+(on?'24px':'2px')+';width:24px;height:24px;border-radius:50%;background:'+(on?'#fff8ec':'#d8d2c4')+';box-shadow:0 1px 3px rgba(0,0,0,.4);transition:left .25s"></div>'
      +'</div>'
    +'</div>'
  +'</div>';
}

var MORPH_E='cubic-bezier(.3,1.08,.32,1)',MORPH_D=400,morphBusy=false;
function morphSrc(sel,box){var els=document.querySelectorAll(sel);for(var i=0;i<els.length;i++){if(els[i]!==box&&(!box||!box.contains(els[i]))&&els[i].offsetParent)return els[i];}return null;}
function morphFlip(box,src){ /* 以 transform 表达源矩形（GPU合成，3D再忙不掉帧） */
  var fin=box.getBoundingClientRect(),fr=src.getBoundingClientRect();
  return 'translate('+(fr.left-fin.left)+'px,'+(fr.top-fin.top)+'px) scale('+(fr.width/fin.width)+','+(fr.height/fin.height)+')';
}
function morphOpen(boxId,srcSel){
  if(reducedMotion())return;
  var box=document.getElementById(boxId);if(!box)return;
  var src=morphSrc(srcSel,box);if(!src)return;
  var bs=box.style,origCss=bs.cssText;
  box.classList.add('zjMorphHide');
  bs.transition='none';bs.transformOrigin='0 0';bs.willChange='transform';
  bs.transform=morphFlip(box,src);
  box.offsetWidth;
  bs.transition='transform '+MORPH_D+'ms '+MORPH_E;
  bs.transform='';
  var sh=document.createElement('div');sh.className='zjSheen';sh.style.animation='zjSweep '+Math.round(MORPH_D*1.4)+'ms 60ms cubic-bezier(.4,.2,.3,1) both';box.appendChild(sh);
  morphLock++;
  setTimeout(function(){box.classList.remove('zjMorphHide');box.classList.add('zjMorphShow');},MORPH_D*0.35);
  var fin1=false;
  function finOpen(){if(fin1)return;fin1=true;box.removeEventListener('transitionend',teOpen);
    if(sh.parentNode)sh.parentNode.removeChild(sh);
    box.classList.remove('zjMorphShow');box.classList.remove('zjMorphHide');
    bs.cssText=origCss;
    morphLock--;morphFlush();}
  function teOpen(e){if(e.target===box&&e.propertyName==='transform')setTimeout(finOpen,200);}
  box.addEventListener('transitionend',teOpen);
  setTimeout(finOpen,MORPH_D+1200);
}
function morphClose(boxId,srcSel,done){
  var box=document.getElementById(boxId);
  if(reducedMotion()||!box||morphBusy){done();return;}
  var src=morphSrc(srcSel,box);
  if(!src){done();return;}
  morphBusy=true;morphLock++;
  var bs=box.style;
  bs.transition='none';bs.transformOrigin='0 0';bs.willChange='transform,opacity';
  bs.transform='';
  box.offsetWidth;
  bs.transition='transform '+MORPH_D+'ms '+MORPH_E+',opacity 150ms '+(MORPH_D-170)+'ms';
  box.classList.add('zjMorphHide');
  bs.transform=morphFlip(box,src);
  bs.opacity='0';
  var fin2=false;
  function finClose(){if(fin2)return;fin2=true;box.removeEventListener('transitionend',teClose);
    morphBusy=false;morphLock--;done();morphFlush();}
  function teClose(e){if(e.target===box&&e.propertyName==='transform')finClose();}
  box.addEventListener('transitionend',teClose);
  setTimeout(finClose,MORPH_D+1200);
}

/* iOS 键盘：布局视口不缩、整页被平移 → 用 visualViewport 让 #zj 精确贴合可见区，

if(window.visualViewport){(function(){
  var vv=window.visualViewport,zjEl=null,t2=null,baseH=window.innerHeight;
  function typing(){var ae=document.activeElement;return !!(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'));}
  window.addEventListener('resize',function(){if(!typing())baseH=window.innerHeight;});
  function vvFix(){
    zjEl=zjEl||document.getElementById('zj');if(!zjEl)return;
    var layoutResized=window.innerHeight<baseH-60; // 布局视口已随键盘自缩（安卓等）：浏览器处理
    var gap=Math.max(0,Math.round(window.innerHeight-vv.height)); // iOS：布局不缩，此值≈键盘总高
    if(typing()&&gap>60&&!layoutResized){
      var pb=gap+'px';
      if(zjEl.style.paddingBottom!==pb)zjEl.style.paddingBottom=pb; // 容器保持全屏，仅内容让位
      if(window.scrollY||vv.offsetTop>2)window.scrollTo(0,0);       // 顶住 iOS 的整页平移
    }else if(zjEl.style.paddingBottom||!typing()){
      if(zjEl.style.paddingBottom)zjEl.style.paddingBottom='';
      if(!typing()&&(window.scrollY||vv.offsetTop>2))window.scrollTo(0,0);
    }
  }
  vv.addEventListener('resize',function(){clearTimeout(t2);t2=setTimeout(vvFix,60);});
  vv.addEventListener('scroll',function(){clearTimeout(t2);t2=setTimeout(vvFix,60);});
  window.addEventListener('focusout',function(){setTimeout(vvFix,80);});
})();}
